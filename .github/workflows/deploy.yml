name: Deploy to Genious (dinakenitrafc.ma)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd, zip
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies (production)
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --no-progress \
            --prefer-dist

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prune dev-only files before upload
        run: |
          rm -rf node_modules
          rm -rf tests
          rm -f phpunit.xml phpunit.xml.dist
          rm -f .editorconfig .gitattributes .gitignore
          rm -f README.md
          rm -f .env .env.example .env.local .env.testing

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via lftp (mirror over FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          # Do not include the workflow directory in the mirror.
          rm -rf .github

          # Write a config-less lftp session to a temp script so bash
          # interpolates the env vars once, then hand off to lftp.
          cat > /tmp/deploy.lftp <<LFTPEOF
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-allow yes
          set ftp:passive-mode on
          set net:max-retries 8
          set net:reconnect-interval-base 3
          set net:reconnect-interval-max 30
          set net:timeout 60
          set mirror:parallel-transfer-count 1
          open -p ${FTP_PORT} -u ${FTP_USER},${FTP_PASSWORD} ${FTP_HOST}
          mirror \
            --reverse \
            --continue \
            --loop \
            --parallel=1 \
            --verbose=1 \
            --exclude-glob '.env' \
            --exclude-glob '.env.*' \
            --exclude-glob '.git' \
            --exclude-glob '.git/**' \
            --exclude-glob 'node_modules' \
            --exclude-glob 'node_modules/**' \
            --exclude-glob 'tests' \
            --exclude-glob 'tests/**' \
            --exclude-glob 'storage/app' \
            --exclude-glob 'storage/app/**' \
            --exclude-glob 'storage/framework/cache' \
            --exclude-glob 'storage/framework/cache/**' \
            --exclude-glob 'storage/framework/sessions' \
            --exclude-glob 'storage/framework/sessions/**' \
            --exclude-glob 'storage/framework/views' \
            --exclude-glob 'storage/framework/views/**' \
            --exclude-glob 'storage/logs' \
            --exclude-glob 'storage/logs/**' \
            --exclude-glob 'phpmyadmin' \
            --exclude-glob 'phpmyadmin/**' \
            ./ /
          bye
          LFTPEOF

          lftp -f /tmp/deploy.lftp

      - name: Trigger post-deploy hook (artisan migrate + cache)
        run: |
          echo "Calling deploy hook..."
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.DEPLOY_HOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_HOOK_SECRET }}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Deploy hook failed with HTTP $STATUS"
            exit 1
          fi
